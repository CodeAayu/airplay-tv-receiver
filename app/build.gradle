plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codeaayu.airplaytv'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.codeaayu.airplaytv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            // the TV runs 32-bit ARM apps only
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
